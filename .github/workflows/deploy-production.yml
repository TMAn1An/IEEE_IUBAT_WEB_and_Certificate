name: Deploy to Production (cPanel)

# Automatic production deployment is now active: every push to `main`
# (including a PR merge, which GitHub performs as an ordinary push to the
# base branch) triggers a real deploy. This followed, in order: a dry run
# dispatch, three supervised real dispatches that each found and fixed a
# distinct production-pipeline bug (see docs/CHANGELOG.md -- storage/.env
# symlinks, migrate --pretend's interactive confirmation, and a database-
# backup credential-handling rewrite), and a fourth real dispatch that
# finally succeeded end-to-end (run 38682171689, commit d5282a4). See PR #1
# for the original dispatch-only rationale and PRs #4-#6 for the fixes.
#
# `branches: [main]` scopes the push trigger to `main` only -- a push to any
# other branch (a feature branch, a PR's own branch) does not start this
# workflow at all, so it cannot reach the `deploy` job or its `production`
# environment. `workflow_dispatch` is kept, with `dry_run` still defaulting
# to true, as a manual/inspection path independent of a push (e.g. to dry-
# run-validate a hotfix branch's deployability before merging, or to retry
# a deploy without creating a new commit).
#
# One-time prerequisite (NOT performed by this workflow): the production
# server must already be bootstrapped into the releases/shared/current
# layout this workflow assumes (see scripts/production-bootstrap.sh and
# docs/DEPLOYMENT_CPANEL.md's "Releases layout" section). This workflow
# checks for that layout and fails with a clear message rather than
# attempting to restructure the server itself -- that is a separate,
# explicitly-gated, one-time action.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: validate + connect only, write nothing to production"
        type: boolean
        default: true

# Only one deployment at a time, ever. A second push while one is running
# queues behind it rather than racing it (cancel-in-progress stays false on
# purpose -- an in-flight deploy must finish or fail cleanly, never be killed
# mid-way by a newer push).
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTE_BASE: /home/ieeeiubat
  REMOTE_RELEASES: /home/ieeeiubat/releases
  REMOTE_SHARED: /home/ieeeiubat/shared
  REMOTE_CURRENT: /home/ieeeiubat/current
  REMOTE_PUBLIC_HTML: /home/ieeeiubat/public_html
  REMOTE_BACKUPS: /home/ieeeiubat/backups/releases
  PRODUCTION_URL: https://ieee.iubat.edu
  # A lock older than this is treated as abandoned by a crashed/killed run
  # rather than a genuinely in-progress one -- kept comfortably above this
  # job's own timeout-minutes so a *real* in-progress run can never be
  # mistaken for stale.
  LOCK_STALE_SECONDS: 1800

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Default fetch-depth:1 would make the destructive-migration
          # heuristic's `HEAD~20` range always invalid (git log silently
          # no-ops inside an `if`, rather than erroring -- it just never
          # actually checks anything). 50 is comfortably more than any
          # single push is expected to carry.
          fetch-depth: 50

      - name: Record the exact commit being deployed
        id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Composer validate + full install (with dev deps, needed to run tests)
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction

      - name: Run the Laravel test suite (sqlite, fully disposable)
        run: |
          cp .env.example .env
          php artisan key:generate --force --quiet
          php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Validate pending migrations against a disposable sqlite DB
        run: |
          # A real file, not ":memory:" -- separate `php artisan` invocations are
          # separate processes and an in-memory sqlite DB does not survive
          # between them.
          touch /tmp/ci-migrate-check.sqlite
          php artisan migrate --force
          php artisan migrate:status
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/ci-migrate-check.sqlite

      - name: Record a destructive-migration heuristic check for the deploy job
        run: |
          # Heuristic, not a guarantee: flags DROP/TRUNCATE/RENAME COLUMN in any
          # migration file added/changed since the last deployed commit. The
          # deploy job re-runs this check against the *actual* pending set
          # (this is just a build-time early warning).
          if git log -p --no-color "${{ github.event.before || 'HEAD~20' }}..HEAD" -- database/migrations 2>/dev/null \
               | grep -iE '^\+.*\b(dropColumn|dropIfExists|Schema::drop\(|truncate\(|renameColumn)\b'; then
            echo "::warning::One or more recently-changed migrations contain drop/truncate/rename-column calls. The deploy job will refuse to auto-apply a migration whose --pretend SQL contains a destructive statement -- if this is expected, it will need a manual, reviewed migrate run instead of the automated one."
          fi

      - name: Confirm pinned PDF Studio build matches the shipped editor assets
        run: |
          pinned=$(php -r "require 'vendor/autoload.php'; echo (require 'config/pdf-studio.php')['source_commit'];")
          manifest=$(php -r "echo json_decode(file_get_contents('public/vendor/pdf-editor/manifest.json'), true)['commit'];")
          echo "config/pdf-studio.php source_commit: $pinned"
          echo "manifest.json commit:                $manifest"
          test -n "$manifest"
          if [ "$pinned" != "$manifest" ]; then
            echo "::error::Pinned pdf-studio commit ($pinned) does not match synced asset manifest ($manifest) -- re-run scripts/sync-pdf-editor-assets.php"
            exit 1
          fi
          test -d "public/vendor/pdf-editor/${manifest:0:12}/pdfjs/wasm" || { echo "::error::Pinned pdf-editor build is missing its pdfjs/wasm directory"; exit 1; }
          test -d "public/vendor/pdf-editor/${manifest:0:12}/pdfjs/standard_fonts" || { echo "::error::Pinned pdf-editor build is missing its standard_fonts directory"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS deps from the committed lockfile (fails if lockfile is stale) and build
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Clean up the throwaway CI .env before packaging
        run: rm -f .env /tmp/ci-migrate-check.sqlite

      - name: Re-install without dev dependencies for the shipped release
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Package the deployable application (code + vendor/ + built assets)
        run: |
          # .env is explicitly excluded: it must never be shipped from CI and must
          # never overwrite the real production .env (APP_KEY, DB credentials, etc).
          #
          # The ENTIRE storage/ directory is excluded, not just specific
          # subdirectories -- storage/ is always the shared/storage symlink on
          # production (certificate PDFs, batch imports, logs, framework
          # cache/sessions/views are all persistent, cross-release state).
          # Excluding only some subdirectories (the previous version of this
          # exclude list) still leaves tar creating storage/ and storage/framework/
          # as real directories in the extracted release -- and `ln -sfn` does
          # NOT replace an existing real directory, it creates the symlink
          # *inside* it instead, silently leaving storage/framework/views
          # missing and breaking Laravel's bootstrap (this broke a real
          # deploy: see docs/CHANGELOG.md). Shipping none of storage/ removes
          # the directory from the tarball entirely, so there's nothing for
          # the symlink step to collide with.
          tar --exclude='.git' --exclude='node_modules' --exclude='tests' \
              --exclude='.env' --exclude='.env.*' \
              --exclude='./storage' \
              -czf /tmp/release.tar.gz .
          sha256sum /tmp/release.tar.gz > /tmp/release.sha256

      - name: Verify the release archive contains everything required
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          tar -tzf /tmp/release.tar.gz > "$manifest"
          required=(
            "./artisan"
            "./composer.json"
            "./vendor/autoload.php"
            "./public/index.php"
            "./public/build/manifest.json"
            "./public/vendor/pdf-editor/manifest.json"
            "./config/pdf-studio.php"
            "./database/migrations/"
            "./bootstrap/app.php"
          )
          missing=0
          for path in "${required[@]}"; do
            if ! grep -qF "$path" "$manifest"; then
              echo "::error::Release archive is missing required path: $path"
              missing=1
            fi
          done
          for forbidden in '^\./\.env$' '\./\.env\.' '^\./storage/'; do
            if grep -qE "$forbidden" "$manifest"; then
              echo "::error::Release archive unexpectedly contains a forbidden path matching: $forbidden"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || { echo "::error::Release archive failed content validation -- refusing to deploy it."; exit 1; }
          echo "Release archive content check passed ($(wc -l < "$manifest") entries)."

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            /tmp/release.tar.gz
            /tmp/release.sha256
          retention-days: 14

  deploy:
    needs: build-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      # Full history (fetch-depth: 0) is required here, not for packaging
      # (that already happened in build-and-validate) but so the "guarding
      # against deploying an outdated commit" check below -- git merge-base
      # --is-ancestor -- has the currently-active production release's
      # commit available locally to compare against, however far back it is.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: /tmp

      - name: Verify downloaded artifact checksum
        run: |
          cd /tmp
          sha256sum -c release.sha256

      - name: Establish a fingerprint-verified SSH connection
        id: ssh-setup
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST_FINGERPRINT: ${{ secrets.CPANEL_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d)"
          echo "work_dir=$work_dir" >> "$GITHUB_OUTPUT"

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$work_dir/key"
          chmod 600 "$work_dir/key"

          ssh-keyscan -T 15 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$work_dir/known_hosts"
          actual="$(ssh-keygen -lf "$work_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)"
          if [ "$actual" != "$HOST_FINGERPRINT" ]; then
            echo "::error::Server fingerprint mismatch ($actual). Refusing to deploy -- possible MITM or rotated host key that needs re-verifying out of band."
            exit 1
          fi

          cat > "$work_dir/ssh.sh" <<EOF
          #!/bin/bash
          ssh -i "$work_dir/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work_dir/known_hosts" \
              -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "\$@"
          EOF
          chmod +x "$work_dir/ssh.sh"

          cat > "$work_dir/scp.sh" <<EOF
          #!/bin/bash
          scp -i "$work_dir/key" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work_dir/known_hosts" \
              -o ConnectTimeout=20 "\$@"
          EOF
          chmod +x "$work_dir/scp.sh"

      - name: Dry run -- read-only connectivity, layout and lock inspection, no writes
        # Explicit on event type, not just a bare `inputs.dry_run`: a push
        # event has no `inputs` at all, and this step must never run for one
        # regardless of how that context happens to evaluate.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          work_dir="${{ steps.ssh-setup.outputs.work_dir }}"
          "$work_dir/ssh.sh" "
            set -e
            echo '--- whoami / tool versions ---'
            whoami && php -v && git --version && composer --version && rsync --version | head -1
            echo '--- releases/shared/current layout bootstrapped? ---'
            test -d '${{ env.REMOTE_RELEASES }}' && echo 'releases/ OK' || echo 'releases/ MISSING -- run scripts/production-bootstrap.sh once (not performed by this workflow)'
            test -f '${{ env.REMOTE_SHARED }}/.env' && echo 'shared/.env OK' || echo 'shared/.env MISSING'
            test -d '${{ env.REMOTE_SHARED }}/storage' && echo 'shared/storage OK' || echo 'shared/storage MISSING'
            if [ -L '${{ env.REMOTE_CURRENT }}' ]; then
              echo \"current -> \$(readlink '${{ env.REMOTE_CURRENT }}')\"
            else
              echo 'current symlink MISSING -- NOT bootstrapped yet, a real deploy will refuse to run'
            fi
            echo '--- public_html ---'
            test -d '${{ env.REMOTE_PUBLIC_HTML }}' && echo 'public_html OK' || echo 'public_html MISSING'
            test -f '${{ env.REMOTE_PUBLIC_HTML }}/index.php' && echo 'index.php present (will NOT be touched by a regular deploy)' || echo 'index.php MISSING -- investigate before any real deploy'
            echo '--- deploy lock currently held? ---'
            if [ -d '${{ env.REMOTE_BASE }}/.deploy.lock' ]; then
              cat '${{ env.REMOTE_BASE }}/.deploy.lock/meta' 2>/dev/null || echo '(lock dir exists, no metadata file -- unusual)'
            else
              echo 'lock free'
            fi
            echo '--- current deployed commit (if bootstrapped) ---'
            if [ -L '${{ env.REMOTE_CURRENT }}' ]; then
              git -C \"\$(readlink -f '${{ env.REMOTE_CURRENT }}')\" rev-parse HEAD 2>&1 || echo '(current release is not a git checkout)'
            fi
          "
          echo "::notice::DRY RUN complete. No files were written and nothing was restarted on production."

      - name: Real deploy
        # A push always deploys for real. A workflow_dispatch deploys for
        # real only when dry_run was explicitly set to false.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          DEPLOY_SHA: ${{ needs.build-and-validate.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          work_dir="${{ steps.ssh-setup.outputs.work_dir }}"
          ssh_run() { "$work_dir/ssh.sh" "$@"; }

          echo "--- preflight: refuse to run unless the releases/shared/current layout is bootstrapped ---"
          ssh_run "
            set -e
            test -d '${{ env.REMOTE_RELEASES }}' || { echo '::error::${{ env.REMOTE_RELEASES }} does not exist -- run the one-time scripts/production-bootstrap.sh first.'; exit 1; }
            test -f '${{ env.REMOTE_SHARED }}/.env' || { echo '::error::${{ env.REMOTE_SHARED }}/.env does not exist -- server is not bootstrapped.'; exit 1; }
            test -d '${{ env.REMOTE_SHARED }}/storage' || { echo '::error::${{ env.REMOTE_SHARED }}/storage does not exist -- server is not bootstrapped.'; exit 1; }
            test -L '${{ env.REMOTE_CURRENT }}' || { echo '::error::${{ env.REMOTE_CURRENT }} is not a symlink -- server is not bootstrapped.'; exit 1; }
          "

          echo "--- acquiring deploy lock, with stale-lock recovery ---"
          ssh_run "
            set -e
            mkdir -p '${{ env.REMOTE_BASE }}'
            if ! mkdir '${{ env.REMOTE_BASE }}/.deploy.lock' 2>/dev/null; then
              now=\$(date +%s)
              started=\$(grep -oE '^started_at=[0-9]+' '${{ env.REMOTE_BASE }}/.deploy.lock/meta' 2>/dev/null | cut -d= -f2 || echo 0)
              age=\$(( now - started ))
              if [ \"\$age\" -gt '${{ env.LOCK_STALE_SECONDS }}' ]; then
                echo \"::warning::Found a deploy lock older than \$age seconds (run \$(cat '${{ env.REMOTE_BASE }}/.deploy.lock/meta' 2>/dev/null) ) -- treating as abandoned and reclaiming.\"
                rm -rf '${{ env.REMOTE_BASE }}/.deploy.lock'
                mkdir '${{ env.REMOTE_BASE }}/.deploy.lock'
              else
                echo '::error::Another deployment is in progress (lock age '\"\$age\"'s, under the '${{ env.LOCK_STALE_SECONDS }}'s staleness threshold). Aborting without touching anything.'
                exit 1
              fi
            fi
            printf 'run_id=${{ github.run_id }}\nstarted_at=%s\n' \"\$(date +%s)\" > '${{ env.REMOTE_BASE }}/.deploy.lock/meta'
          "
          cleanup() { ssh_run "rm -rf '${{ env.REMOTE_BASE }}/.deploy.lock' 2>/dev/null || true"; }
          trap cleanup EXIT

          echo "--- recording rollback point ---"
          prev_release="$(ssh_run "readlink '${{ env.REMOTE_CURRENT }}'")"
          echo "Previous release: $prev_release"

          echo "--- guarding against deploying an outdated commit over a newer release ---"
          # release directories are always named after the git commit they
          # were built from (both this workflow's activation step and the
          # one-time scripts/production-bootstrap.sh), so the basename of the
          # `current` symlink's target is the SHA presently live in
          # production. Refuse to proceed unless $DEPLOY_SHA is that commit
          # or a descendant of it -- this is what stops a stale/outdated
          # workflow run (an old queued dispatch, a re-run of a superseded
          # job) from overwriting a newer production release with older
          # code. A legitimate rollback is still possible: revert forward
          # with a new commit and deploy that, rather than re-deploying an
          # old SHA directly.
          prev_sha="$(basename "$prev_release")"
          if [ "$prev_sha" = "$DEPLOY_SHA" ]; then
            echo "DEPLOY_SHA ($DEPLOY_SHA) already matches the currently-active release -- idempotent re-deploy, proceeding."
          elif git merge-base --is-ancestor "$prev_sha" "$DEPLOY_SHA" 2>/tmp/ancestry.err; then
            echo "Confirmed: $DEPLOY_SHA is a descendant of the currently-active release $prev_sha -- safe to proceed."
          else
            echo "::error::Refusing to deploy $DEPLOY_SHA over the currently-active production release $prev_sha -- $DEPLOY_SHA is not a descendant of $prev_sha (it may be older, or on a diverged/rewritten history). This guards against an outdated workflow run or a stale dispatch overwriting a newer production release."
            cat /tmp/ancestry.err 2>/dev/null || true
            exit 1
          fi

          echo "--- backing up current release + current public_html before any change ---"
          backup_name="$(date -u +%Y%m%dT%H%M%SZ)-pre-$DEPLOY_SHA"
          # A failed backup here must abort the whole deploy -- it is the only copy of
          # public_html's state before this run touches anything. No `|| true`.
          ssh_run "
            set -e
            mkdir -p '${{ env.REMOTE_BACKUPS }}'
            tar -czf '${{ env.REMOTE_BACKUPS }}/$backup_name.tar.gz' -C '${{ env.REMOTE_PUBLIC_HTML }}' .
            test -s '${{ env.REMOTE_BACKUPS }}/$backup_name.tar.gz' || { echo '::error::public_html backup archive is empty or missing -- aborting before touching anything.'; exit 1; }
            tar -tzf '${{ env.REMOTE_BACKUPS }}/$backup_name.tar.gz' >/dev/null || { echo '::error::public_html backup archive failed integrity check -- aborting.'; exit 1; }
          " || { echo "::error::public_html backup failed. Deploy aborted before any change was made to production."; exit 1; }

          echo "--- shipping release artifact ---"
          "$work_dir/scp.sh" /tmp/release.tar.gz "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/tmp/release-$DEPLOY_SHA.tar.gz"

          rollback() {
            echo "::error::Deploy step failed -- rolling back to $prev_release"
            ssh_run "
              set -e
              rm -rf '${{ env.REMOTE_CURRENT }}.new'
              ln -sfn '$prev_release' '${{ env.REMOTE_CURRENT }}.new'
              mv -Tf '${{ env.REMOTE_CURRENT }}.new' '${{ env.REMOTE_CURRENT }}'
              rsync -a --delete --exclude='index.php' --exclude='.htaccess' --exclude='.htpasswd' --exclude='.well-known' --exclude='cgi-bin' --exclude='error_log' --exclude='.user.ini' \
                \"\$(readlink -f '${{ env.REMOTE_CURRENT }}')\"/public/ '${{ env.REMOTE_PUBLIC_HTML }}/'
            "
            echo "::error::Rollback to $prev_release completed -- current symlink and public_html both reverted. This run is FAILED, not succeeded. Migrations are NEVER rolled back automatically: if 'applying migrations' had already run and succeeded before this failure, the schema stays at the new version even though the code just reverted (migrations are written forward-compatible so the previous release's code should still run against it). If a migration itself is what failed, backups/db/$backup_name.sql.gz (taken immediately before migrate --force) is the restore point -- that restore is a manual DBA action, never automatic."
            exit 1
          }

          echo "--- building new release in its own directory (old release keeps serving until activation) ---"
          ssh_run "
            set -e
            release_dir='${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA'
            rm -rf \"\$release_dir\"
            mkdir -p \"\$release_dir\"
            tar --exclude='.env' --exclude='.env.*' --exclude='./storage' -xzf /tmp/release-$DEPLOY_SHA.tar.gz -C \"\$release_dir\"
            rm -f /tmp/release-$DEPLOY_SHA.tar.gz

            # Link the two shared paths into the release -- defensively: 'ln -sfn
            # TARGET LINK' does NOT replace LINK if it's already a real file/directory,
            # it creates the symlink *inside* it instead (this broke a real deploy:
            # see docs/CHANGELOG.md). The CI tarball never ships storage/ or .env, but
            # this guards the release_dir's own copy regardless of how it got there --
            # always safe to rm, since release_dir was just freshly created above and
            # is never \$SHARED itself.
            for name in .env storage; do
              target=\"\$release_dir/\$name\"
              if [ -e \"\$target\" ] && [ ! -L \"\$target\" ]; then
                echo \"::warning::\$target already existed as a real file/directory (not a symlink) before linking -- removing this release's own copy (never touches \${{ env.REMOTE_SHARED }}) so the shared symlink can take its place.\"
                rm -rf \"\$target\"
              fi
            done
            ln -sfn '${{ env.REMOTE_SHARED }}/.env' \"\$release_dir/.env\"
            ln -sfn '${{ env.REMOTE_SHARED }}/storage' \"\$release_dir/storage\"

            # Validate both symlinks actually resolve to the expected shared targets
            # -- not just 'a symlink exists', but 'it points at the right place' --
            # before Composer runs any Artisan scripts (package:discover caches
            # config/routes and needs a real, writable storage/framework/*).
            env_resolved=\$(readlink -f \"\$release_dir/.env\")
            storage_resolved=\$(readlink -f \"\$release_dir/storage\")
            expected_env=\$(readlink -f '${{ env.REMOTE_SHARED }}/.env')
            expected_storage=\$(readlink -f '${{ env.REMOTE_SHARED }}/storage')
            [ \"\$env_resolved\" = \"\$expected_env\" ] || { echo \"::error::.env symlink resolved to '\$env_resolved', expected '\$expected_env' -- aborting before touching anything live.\"; exit 1; }
            [ \"\$storage_resolved\" = \"\$expected_storage\" ] || { echo \"::error::storage symlink resolved to '\$storage_resolved', expected '\$expected_storage' -- aborting before touching anything live.\"; exit 1; }
            test -f \"\$release_dir/.env\" || { echo '::error::Shared .env symlink did not resolve to a readable file -- aborting before touching anything live.'; exit 1; }
            for dir in framework/cache framework/sessions framework/views framework/testing logs; do
              test -d \"\$release_dir/storage/\$dir\" || { echo \"::error::\$release_dir/storage/\$dir is missing on the shared storage target -- aborting before Composer/Artisan need it.\"; exit 1; }
              test -w \"\$release_dir/storage/\$dir\" || { echo \"::error::\$release_dir/storage/\$dir is not writable -- Blade/route/config caching would fail. Aborting before Composer runs.\"; exit 1; }
            done
            echo 'Shared .env and storage symlinks verified; framework cache directories present and writable.'

            cd \"\$release_dir\"
            # Not --quiet: Composer's own output (including the real error behind
            # a failed post-autoload-dump script, e.g. artisan package:discover) must
            # reach the deploy log -- a real deploy failed with only the generic
            # 'returned with error code 1' line visible because --quiet suppressed
            # the actual exception. Composer's install output never includes secret
            # values (no .env contents, no DB credentials) -- only package names,
            # versions and script names -- so this is safe to leave unsuppressed.
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            chmod -R ug+rwX bootstrap/cache
          " || rollback

          echo "--- validating pending migrations are non-destructive before applying ---"
          ssh_run "
            set -e
            cd '${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA'
            # --force is required: APP_ENV=production makes Laravel's
            # ConfirmableTrait ask an interactive 'Are you sure you want to run
            # this command? (yes/no)' before even a --pretend run, and GitHub
            # Actions has no stdin to answer it -- the previous version of this
            # step (no --force) hung on that prompt until it failed, with the
            # real reason never visible because 'set -e' killed the script at
            # the \\\$(...) assignment before any echo ran. --pretend stays
            # mandatory: --force only skips the confirmation prompt, it never
            # makes --pretend apply anything -- --pretend always just prints
            # the SQL regardless of --force.
            if ! pretend_output=\$(php artisan migrate --pretend --force 2>&1); then
              echo '::error::php artisan migrate --pretend --force failed -- aborting before anything is touched. Output below (Laravel'\"'\"'s own diagnostic output; contains no secrets -- no .env values or credentials are ever printed by migrate --pretend):'
              echo \"\$pretend_output\"
              exit 1
            fi
            if echo \"\$pretend_output\" | grep -iE 'drop |truncate |rename column'; then
              echo '::error::A pending migration'\"'\"'s SQL contains DROP/TRUNCATE/RENAME COLUMN. Refusing to auto-apply it. Review and run it manually with a fresh DB backup, then re-run this deploy once the schema is already up to date (migrate --force will then no-op).'
              exit 1
            fi
            echo \"\$pretend_output\"
          " || rollback

          echo "--- backing up the database before migrating ---"
          ssh_run "
            set -eo pipefail
            cd '${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA'
            mkdir -p '${{ env.REMOTE_BACKUPS }}/../db'
            option_file=\"\$(mktemp)\"
            sql_tmp=\"\"
            cleanup_option_file() { rm -f \"\$option_file\" \"\$sql_tmp\"; }
            trap cleanup_option_file EXIT
            chmod 600 \"\$option_file\"
            # write-db-backup-option-file.php parses the release's own .env directly
            # with phpdotenv (no tinker/PsySH boot, no shell interpolation of secret
            # values) and writes user/password/host/port into a chmod-600 MySQL
            # option file. Only the option file's PATH and the (non-secret) database
            # name ever touch this shell -- the password never appears on a command
            # line or in a command substitution, so no shell metacharacter it might
            # contain (quotes, \\\$, parentheses, backslashes, spaces) can break
            # anything here.
            if ! db_name=\$(php scripts/deploy/write-db-backup-option-file.php \"\$option_file\"); then
              echo '::error::Could not prepare database credentials for backup -- see the diagnostic above. Refusing to migrate without a verified fresh backup.'
              exit 1
            fi
            dump_path='${{ env.REMOTE_BACKUPS }}/../db/$backup_name.sql.gz'
            # set -o pipefail above is required here: in \`mysqldump | gzip\`, bash's exit
            # status for the pipeline is otherwise only gzip's -- a failed mysqldump
            # piped into a gzip that happily compresses zero bytes would look like
            # success without pipefail, leaving a corrupt/empty 'backup' on disk.
            #
            # (the backticks just above are backslash-escaped: this whole Real
            # deploy step is itself one big double-quoted bash string passed to
            # ssh_run, so an unescaped backtick pair here is not an inert comment
            # to the LOCAL runner-side bash parsing that string -- it is live
            # command substitution, executed on the runner right now, comment or
            # not. An unescaped double-quote character here would be just as
            # dangerous, for the same reason: it would close the outer string
            # early and dump everything after it into bash as literal code rather
            # than string content, so this comment avoids using any. That exact
            # backtick bug -- a bare pair around mysqldump-pipe-gzip on this very
            # line -- is the real root cause of a production deploy failure: the
            # runner executed the literal text mysqldump-pipe-gzip as a command
            # while parsing this string, producing gzip's null-byte-laden binary
            # output, which got spliced into the string and corrupted everything
            # after it, surfacing on the remote end as a command substitution
            # null-byte warning followed by a syntax error near an orphaned
            # close-paren. Escaping neutralizes it for this local parse; the
            # resulting plain comment text sent to the remote shell is inert
            # there regardless, since a hash comment consumes the rest of its
            # line unconditionally on the remote side too.)
            if ! mysqldump --defaults-extra-file=\"\$option_file\" \"\$db_name\" 2>/tmp/mysqldump.err | gzip > \"\$dump_path\"; then
              echo '::error::Database backup failed -- see captured stderr below. Refusing to migrate without a verified fresh backup.'
              cat /tmp/mysqldump.err
              rm -f \"\$dump_path\"
              exit 1
            fi
            # Verify the backup is both a valid gzip stream and contains actual SQL, not
            # just an empty/truncated file that would pass a bare existence check.
            if ! gzip -t \"\$dump_path\"; then
              echo '::error::Database backup file failed gzip integrity check -- refusing to migrate.'
              exit 1
            fi
            # Decompress once to a temp file and grep *that file*, rather than piping
            # zcat straight into grep -q. grep -q stops reading as soon as it has one
            # match and exits 0 -- on a real multi-table dump the match lands long
            # before zcat finishes writing the rest, so zcat gets SIGPIPE when grep
            # closes its end of the pipe. Under 'set -o pipefail' the pipeline's exit
            # status is the *rightmost non-zero* status among all stages, so zcat's
            # SIGPIPE (141) wins even though grep matched successfully -- the backup
            # looked invalid every single time despite containing a valid header and
            # all 31 application tables. Grepping a plain file has no producer to
            # race against, so this can't recur. (Confirmed: a 3-line fixture never
            # triggers the race because zcat finishes before grep can match early;
            # a realistic ~30-table dump triggers it on every run.)
            sql_tmp=\"\$(mktemp)\"
            if ! zcat \"\$dump_path\" > \"\$sql_tmp\"; then
              echo '::error::Could not decompress database backup for validation -- refusing to migrate.'
              exit 1
            fi
            if ! grep -q '^-- MySQL dump\|^-- MariaDB dump\|CREATE TABLE' \"\$sql_tmp\"; then
              echo '::error::Database backup does not look like a real SQL dump (no CREATE TABLE / dump header found) -- refusing to migrate without a verified backup.'
              exit 1
            fi
            # Positively confirm this is the Laravel application database, not the
            # legacy WordPress database the same cPanel account may still host --
            # both could plausibly produce a file that passes the generic SQL-dump
            # check above, so check for a table name specific to this app's schema.
            if ! grep -qE 'CREATE TABLE .migrations.|CREATE TABLE .certificates.' \"\$sql_tmp\"; then
              echo '::error::Database backup does not contain this application'\"'\"'s tables (migrations/certificates) -- refusing to migrate. Is DB_DATABASE pointing at the wrong (e.g. legacy WordPress) database?'
              exit 1
            fi
            rm -f /tmp/mysqldump.err \"\$sql_tmp\"
            echo \"Database backup verified: \$dump_path (\$(du -h \"\$dump_path\" | cut -f1))\"
          " || rollback

          echo "--- applying migrations ---"
          ssh_run "
            set -e
            cd '${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA'
            php artisan migrate --force
          " || rollback

          echo "--- caching + activating the new release atomically ---"
          ssh_run "
            set -e
            cd '${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA'
            php artisan config:clear --quiet
            php artisan config:cache --quiet
            php artisan route:cache --quiet
            php artisan view:cache --quiet
            cd '${{ env.REMOTE_BASE }}'
            rm -rf current.new
            ln -sfn '${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA' current.new
            mv -Tf current.new current
            rsync -a --delete --exclude='index.php' --exclude='.htaccess' --exclude='.htpasswd' --exclude='.well-known' --exclude='cgi-bin' --exclude='error_log' --exclude='.user.ini' \
              '${{ env.REMOTE_RELEASES }}/$DEPLOY_SHA'/public/ '${{ env.REMOTE_PUBLIC_HTML }}/'
          " || rollback

          echo "--- smoke checks against production ---"
          check() {
            local url="$1" expect="$2"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
            echo "  $url -> $code"
            [ "$code" = "$expect" ]
          }
          smoke_ok=1
          check "${{ env.PRODUCTION_URL }}/" 200 || smoke_ok=0
          check "${{ env.PRODUCTION_URL }}/admin/login" 200 || smoke_ok=0
          check "${{ env.PRODUCTION_URL }}/favicon.ico" 200 || smoke_ok=0
          check "${{ env.PRODUCTION_URL }}/vendor/pdf-editor/manifest.json" 200 || smoke_ok=0

          if [ "$smoke_ok" != "1" ]; then
            rollback
          fi

          echo "--- pruning old releases (keep last 5; never touches shared/, backups/, the active release, or the rollback target) ---"
          ssh_run "
            set -e
            cd '${{ env.REMOTE_RELEASES }}'
            active=\$(basename \"\$(readlink -f '${{ env.REMOTE_CURRENT }}')\")
            rollback_target=\$(basename '$prev_release')
            ls -1dt */ 2>/dev/null \
              | sed 's:/\$::' \
              | grep -vxF \"\$active\" \
              | grep -vxF \"\$rollback_target\" \
              | tail -n +4 \
              | xargs -r -I{} rm -rf -- '{}'
          "

          echo "::notice::Deploy of $DEPLOY_SHA succeeded. Smoke checks passed. Previous release was $prev_release (kept, not deleted, for rollback)."

      - name: Clean up temporary SSH material
        if: always()
        run: rm -rf "${{ steps.ssh-setup.outputs.work_dir }}"
