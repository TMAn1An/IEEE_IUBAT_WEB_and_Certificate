name: cPanel Connection Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify server identity and test SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST_FINGERPRINT: ${{ secrets.CPANEL_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$work_dir/key"

          ssh-keyscan -T 15 -p "$SSH_PORT" -t ed25519 \
            "$SSH_HOST" > "$work_dir/known_hosts"

          actual="$(ssh-keygen -lf "$work_dir/known_hosts" \
            -E sha256 | awk '{print $2}' | sort -u)"

          if [ "$actual" != "$HOST_FINGERPRINT" ]; then
            echo "Server fingerprint mismatch. Connection stopped."
            exit 1
          fi

          ssh \
            -i "$work_dir/key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$work_dir/known_hosts" \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            'whoami && php -v && git --version'
